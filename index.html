<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ko-Nia</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div id="hud-mode"></div>
      <div id="hud-fps"></div>
    </div>
    <div id="start">
      <h1>Ko-Nia</h1>
      <p>Click to start</p>
      <ul>
        <li><b>WASD</b> move · <b>Shift</b> sprint · <b>Space</b> jump</li>
        <li><b>Mouse</b> look · <b>V</b> switch camera · <b>Esc</b> release mouse</li>
      </ul>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
